/**:
  ros__parameters:

    # ── Wolf territory polygon ────────────────────────────────────────────────
    #
    # The wolf must stay INSIDE this zone.
    # Vertices in MAP frame, flat list [x0, y0, x1, y1, ...], ≥ 3 vertices.
    # (These are the values from your original config.)
    wolf_zone_polygon:
      - -1.677   # vertex 0 x
      - 0.632    # vertex 0 y
      - -0.007   # vertex 1 x
      - 0.558    # vertex 1 y
      - -0.007   # vertex 2 x
      - -1.139   # vertex 2 y
      - -0.872   # vertex 3 x
      - -1.924   # vertex 3 y
      - -1.819   # vertex 4 x
      - -0.740   # vertex 4 y

    # ── Rabbit safe zone polygon ──────────────────────────────────────────────
    #
    # The rabbit must stay INSIDE this zone (its home/safe area).
    # Replace the values below with coordinates from RViz /clicked_point.
    rabbit_zone_polygon:
      - -0.761   # vertex 0 x
      - 2.896    # vertex 0 y
      - -1.606   # vertex 1 x
      - 3.060    # vertex 1 y
      - -1.637   # vertex 2 x
      - 1.440    # vertex 2 y
      - -2.130   # vertex 3 x
      - -0.955   # vertex 3 y
      - -0.009   # vertex 4 x
      - -0.955   # vertex 4 y
      - -0.557   # vertex 5 x
      - 0.524    # vertex 5 y
      - -0.346   # vertex 6 x
      - 1.777    # vertex 6 y

    # ── Warning distances ─────────────────────────────────────────────────────
    # Wolf: how far from the boundary edge (m) before WARNING state fires.
    wolf_warning_distance: 0.1
    # Rabbit: slightly larger so the rabbit gets earlier notice.
    rabbit_warning_distance: 0.3

    # ── Control loop rate ─────────────────────────────────────────────────────
    publish_rate: 10.0

    # ── Pose sources ──────────────────────────────────────────────────────────
    # Wolf uses AMCL (map-frame, accurate).
    wolf_pose_topic: /amcl_pose

    # Rabbit uses its own odometry by default (low-latency).
    # If you run AMCL on the rabbit too, change this to /rabbit/amcl_pose
    # and set rabbit_use_amcl: true.
    rabbit_pose_topic: /rabbit/amcl_pose
    rabbit_use_amcl: true

    # ── Output topics — wolf ──────────────────────────────────────────────────
    # WolfFSM subscribes to wolf_status_topic for "SAFE"/"WARNING"/"BREACH"
    # and wolf_detail_topic for key=value distance info.
    wolf_status_topic: /wolf/geofence
    wolf_detail_topic: /wolf/geofence/detail

    # ── Output topics — rabbit ────────────────────────────────────────────────
    # RabbitFSM subscribes to rabbit_status_topic for "SAFE"/"WARNING"/"BREACH"
    # and rabbit_detail_topic for inside_safe_zone=True/False etc.
    rabbit_status_topic: /rabbit/geofence
    rabbit_detail_topic: /rabbit/geofence/detail
